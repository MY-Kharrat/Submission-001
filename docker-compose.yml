  rag-ingest:
    build: .
    profiles: ["tools"]
    command:
      - /bin/sh
      - -c
      - >-
        python -m rag.ingest_json --file 'Cvs dataset/fake_cvs.json' --doc_type cv --source-id internal/cvs &&
        python -m rag.ingest_json --file 'Cvs dataset/fake_projects.json' --doc_type project --source-id internal/projects &&
        python -m rag.ingest_json --file 'Cvs dataset/olivesoft_projects.json' --doc_type project --record-schema olivesoft --source-id internal/olivesoft-projects &&
        python -m rag.ingest_json --file 'Cvs dataset/fake_tools.json' --doc_type tool --source-id internal/tools
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-https://ieoqvhgumbyuhcbfgurl.supabase.co}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-sb_secret_PbkZi90FLObwcEmPUNE7Dg_CRWYNUeP}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      HF_HOME: /models
    volumes:
      - model-cache:/models

volumes:
  olivesoft-data:
  model-cache:
