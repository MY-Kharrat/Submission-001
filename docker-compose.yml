name: olivesoft

services:
  detection:
    build: .
    command: ["uvicorn", "detection.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-super-token}
      OLIVESOFT_DB_PATH: /data/olivesoft.db
    volumes:
      - olivesoft-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  research:
    build: .
    command: ["uvicorn", "research.main:app", "--host", "0.0.0.0", "--port", "8002"]
    restart: unless-stopped
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-super-token}
      OLIVESOFT_DB_PATH: /data/olivesoft.db
      RESEARCH_AUDIT_LOG: /data/research.log
      TAVILY_API_KEY: ${TAVILY_API_KEY:-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}
      LLM_API_KEY: ${LLM_API_KEY:-AQ.Ab8RN6IutAtkyJw4UZ31HG07V81iMy2lMevOiABfThEmFgHyvw}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_URL: ${LLM_URL:-https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
      MAX_SEARCH_ITERATIONS: ${MAX_SEARCH_ITERATIONS:-7}
      TOTAL_RUN_TIMEOUT_SECONDS: ${TOTAL_RUN_TIMEOUT_SECONDS:-45}
      PER_CALL_TIMEOUT_SECONDS: ${PER_CALL_TIMEOUT_SECONDS:-8}
    volumes:
      - olivesoft-data:/data
    ports:
      - "8002:8002"
    depends_on:
      detection:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag:
    build: .
    command: ["uvicorn", "rag.main:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-super-token}
      SUPABASE_URL: ${SUPABASE_URL:-https://ieoqvhgumbyuhcbfgurl.supabase.co}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-sb_secret_PbkZi90FLObwcEmPUNE7Dg_CRWYNUeP}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      HF_HOME: /models
    volumes:
      - model-cache:/models
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

